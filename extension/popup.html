<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stashr Autofill</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <svg class="header__scene" viewBox="0 0 400 64" preserveAspectRatio="xMaxYMax slice" aria-hidden="true">
        <g class="scene-city"><rect x="250" y="22" width="12" height="42"/><rect x="265" y="12" width="9" height="52"/><path d="M278 64V8l7-6 7 6v56z"/><rect x="296" y="26" width="14" height="38"/><rect x="313" y="16" width="10" height="48"/><path d="M327 64V30h18l5 6v28z"/><rect x="354" y="20" width="8" height="44"/><rect x="365" y="34" width="35" height="30"/></g>
        <path class="scene-ridge" d="M180 64c20-14 36-20 54-18 18 2 26-10 44-10 22 0 30 14 52 12 24-2 40-14 70-10v26z"/>
        <path class="scene-river" d="M200 64c30-8 70-10 110-6 30 3 60 2 90-4"/>
      </svg>
      <span class="header__mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v5c0 4.4 3 8.3 7 10 4-1.7 7-5.6 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></svg></span>
      <h2>Stashr <span>Autofill</span></h2>
    </div>

    <!-- Login State -->
    <div id="loginSection" class="section hidden">
      <p class="lede">Sign in with your Stashr account to fill logins on this browser.</p>
      <label class="label" for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" class="input" autocomplete="username">
      <label class="label" for="password">Password</label>
      <input type="password" id="password" placeholder="Your Stashr password" class="input" autocomplete="current-password">
      <input type="text" id="code" placeholder="6-digit code from your authenticator" class="input hidden" autocomplete="one-time-code" inputmode="numeric" aria-label="Two-step code">
      <button id="loginBtn" class="btn btn-primary">Sign in</button>
      <div id="loginError" class="error hidden" role="alert"></div>
    </div>

    <!-- Logged In State -->
    <div id="mainSection" class="section hidden">
      <!-- Login just submitted on a page: ask before saving -->
      <div id="savePrompt" class="hidden">
        <p id="savePromptText"></p>
        <button id="saveYes" class="btn btn-small">Save</button>
        <button id="saveNo" class="btn btn-small btn-secondary">Not now</button>
        <button id="saveNever" class="btn btn-small btn-secondary">Never for this site</button>
      </div>

      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
        <input type="search" id="search" class="input" placeholder="Search accounts" aria-label="Search accounts" autocomplete="off">
      </div>

      <!-- Current Domain Passwords -->
      <div id="currentDomainSection">
        <h3>For this website</h3>
        <div id="currentPasswords" class="password-list"></div>
      </div>

      <!-- Google accounts: pick one and sign in to Google with it -->
      <div id="googleSection" class="hidden">
        <h3>Google accounts</h3>
        <div id="googleAccounts" class="password-list"></div>
      </div>

      <!-- All Passwords -->
      <div id="allPasswordsSection">
        <h3>All accounts</h3>
        <div id="allPasswords" class="password-list"></div>
      </div>
      <p id="emptyState" class="empty hidden">Nothing saved yet. Add logins in the Stashr app, or save one when you sign in to a site.</p>

      <!-- QR Code View -->
      <div id="qrSection" class="section hidden">
        <h3>QR Code</h3>
        <div id="qrContainer"></div>
        <button id="closeQrBtn" class="btn btn-secondary">Close</button>
      </div>

      <div class="footer">
        <button id="logoutBtn" class="btn btn-secondary">Sign out</button>
      </div>
    </div>

    <div id="loadingSpinner" class="spinner hidden" role="status" aria-label="Loading"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
