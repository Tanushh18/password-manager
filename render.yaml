# Render Blueprint for Stashr (password-manager): API server + website.
# In Render: New + > Blueprint > pick this repo (file is picked up from the repo root).
services:
  # Website (Vite + React). Must build from client/, not the repo root.
  - type: web
    name: stashr-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: build
    autoDeploy: true
    envVars:
      # Comma separated API servers (fail-over order), e.g. https://password-manager-server.onrender.com
      - key: VITE_API_URLS
        sync: false
    routes:
      # Single-page app: send every path to index.html so React Router handles it.
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: password-manager-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Values below are asked for on first deploy (never stored in git).
      # Use the SAME values on every server that shares one database,
      # otherwise logins and stored passwords won't work across servers.
      - key: MONGO_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CRYPTO_SECRET_KEY
        sync: false
      # Comma separated client URLs allowed by CORS, e.g. https://my-client.onrender.com
      - key: CLIENT_ORIGINS
        sync: false
      # Generate a long random secret. A trusted scheduler must POST to
      # /render/ops/tick with Authorization: Bearer <this secret>.
      - key: RENDER_MONITOR_CRON_SECRET
        sync: false
      # Forgot-password emails (Brevo transactional email). Without these, "Forgot password" says it is not set up.
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: Stashr
