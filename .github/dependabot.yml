version: 2
updates:
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    groups:
      server-minor-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies", "security"]

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    groups:
      client-minor-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies", "security"]

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    groups:
      mobile-minor-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies", "security"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    labels: ["dependencies", "ci"]
