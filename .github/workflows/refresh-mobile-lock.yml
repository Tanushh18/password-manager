name: Refresh Mobile Lockfile

on:
  push:
    branches: [feat/stashr-full-platform-upgrade]

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: contains(github.event.head_commit.message, '[refresh-mobile-lock]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile the lockfile without running package lifecycle scripts
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit the generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already in sync."
          else
            git commit -m "chore(mobile): refresh Expo SDK lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
