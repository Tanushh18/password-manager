name: Stashr Android Release (server-managed updates)

# Every mobile app change creates a newly signed APK and a GitHub Release.
# There is deliberately no Expo/EAS OTA publishing path.
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      releaseNotes:
        description: "Notes shown in Settings > Check for updates"
        type: string
        default: "Stashr Android update"
        required: true

permissions:
  contents: write

concurrency:
  group: stashr-android-release
  cancel-in-progress: false

jobs:
  build-release:
    name: Build, sign and publish Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify persistent Android signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing GitHub Actions secret: ${name/KEYSTORE_BASE64/ANDROID_KEYSTORE_BASE64}"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD. The same key must be used for every update."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/stashr-upload.jks"
          keytool -list -keystore "$RUNNER_TEMP/stashr-upload.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Stamp a monotonically increasing Android build number
        id: release
        shell: bash
        env:
          RELEASE_NOTES_INPUT: ${{ inputs.releaseNotes }}
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          node - "$VERSION_CODE" <<'NODE'
          const fs = require("fs");
          const path = "./app.json";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          config.expo.android.versionCode = Number(process.argv[2]);
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
          NODE
          NOTES="${RELEASE_NOTES_INPUT:-Stashr Android update}"
          {
            echo "app_version=$APP_VERSION"
            echo "version_code=$VERSION_CODE"
            echo "tag=stashr-v$APP_VERSION-build-$VERSION_CODE"
            echo "release_notes<<EOF"
            printf '%s\n' "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Building Stashr $APP_VERSION (Android versionCode $VERSION_CODE)"

      - name: Resolve native Android project
        run: npx expo prebuild --platform android --no-install --clean
        env:
          CI: "1"

      - name: Build APK using the persistent signing key
        working-directory: mobile/android
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/stashr-upload.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Create update manifest and verify APK
        id: manifest
        shell: bash
        env:
          APP_VERSION: ${{ steps.release.outputs.app_version }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
          RELEASE_NOTES: ${{ steps.release.outputs.release_notes }}
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)
          test -n "$APK" || { echo "::error::Gradle did not produce an APK"; exit 1; }
          cp "$APK" stashr-release.apk
          apksigner verify --verbose stashr-release.apk
          SHA256=$(sha256sum stashr-release.apk | cut -d ' ' -f 1)
          SIZE=$(stat -c '%s' stashr-release.apk)
          node - <<'NODE'
          const fs = require("fs");
          const manifest = {
            packageName: "com.tanush.stashr.com",
            version: process.env.APP_VERSION,
            versionCode: Number(process.env.VERSION_CODE),
            buildNumber: Number(process.env.VERSION_CODE),
            sha256: process.env.SHA256,
            sizeBytes: Number(process.env.SIZE),
            releaseNotes: process.env.RELEASE_NOTES,
            platform: "android",
            delivery: "server-managed-apk",
            builtAt: new Date().toISOString(),
            commit: process.env.GITHUB_SHA
          };
          fs.writeFileSync("stashr-update.json", JSON.stringify(manifest, null, 2) + "\n");
          NODE
          {
            echo "APK SHA-256: $SHA256"
            echo "APK size: $SIZE bytes"
            echo "Android package: com.tanush.stashr.com"
            echo "Version: $APP_VERSION"
            echo "Android versionCode: $VERSION_CODE"
            echo "Update manifest: stashr-update.json"
          } > stashr-build-info.txt
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact for diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: stashr-android-v${{ steps.release.outputs.version_code }}
          path: |
            mobile/stashr-release.apk
            mobile/stashr-update.json
            mobile/stashr-build-info.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK and manifest as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Stashr Android ${{ steps.release.outputs.app_version }} (build ${{ steps.release.outputs.version_code }})
          body: |
            ${{ steps.release.outputs.release_notes }}

            - Package: `com.tanush.stashr.com`
            - Android versionCode: ${{ steps.release.outputs.version_code }}
            - SHA-256: ${{ steps.manifest.outputs.sha256 }}
            - Published by GitHub Actions from commit ${{ github.sha }}

            Install/update from Stashr Settings → Check for updates. Android will ask you to confirm installation.
          files: |
            mobile/stashr-release.apk
            mobile/stashr-update.json
          make_latest: true
          fail_on_unmatched_files: true
