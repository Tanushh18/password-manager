# Builds the Aurelia Android app on Expo's cloud (EAS Build), then
# distributes the APK to testers via Firebase App Distribution.
#
# One-time setup:
#   1. Create an access token at https://expo.dev/settings/access-tokens
#      Add it to this repo as the secret EXPO_TOKEN.
#   2. Create a Firebase project + Android app (package: com.tanush.stashr.com),
#      enable App Distribution, and create a tester group.
#      Add these repo secrets:
#        - FIREBASE_APP_ID            (Firebase console → Project settings → General)
#        - FIREBASE_SERVICE_ACCOUNT_JSON  (Project settings → Service accounts → Generate new private key, paste the whole JSON;
#                                          the older name FIREBASE_SERVICE_ACCOUNT also works)
#   3. Run this workflow from the Actions tab ("Run workflow").
#
# "preview" produces an installable .apk (used for distribution), "production" a Play Store .aab.
name: Android build (EAS)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        type: choice
        options: [preview, production]
        default: preview
      distribute:
        description: "Send to Firebase App Distribution testers (only applies to 'preview' APK builds)"
        type: boolean
        default: true
      testerGroups:
        description: "Firebase tester group alias(es), comma separated"
        type: string
        default: "testers"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    outputs:
      apk-path: ${{ steps.download.outputs.apk-path }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # Links the app to an EAS project on the token's account (creates it the first time).
      - run: eas init --non-interactive --force

      # Waits for the cloud build to finish and prints machine-readable output
      # (unlike --no-wait, which fires the build and exits immediately).
      - name: Build on EAS
        id: build
        run: |
          eas build --platform android --profile ${{ inputs.profile }} --non-interactive --json > build-result.json
          cat build-result.json
          url=$(node -e "console.log(JSON.parse(require('fs').readFileSync('build-result.json','utf8'))[0].artifacts.buildUrl)")
          echo "artifact-url=$url" >> "$GITHUB_OUTPUT"

      - name: Download built APK
        id: download
        if: inputs.profile == 'preview'
        run: |
          curl -L -o app-preview.apk "${{ steps.build.outputs.artifact-url }}"
          echo "apk-path=mobile/app-preview.apk" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact to GitHub Actions
        if: inputs.profile == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: android-preview-apk
          path: mobile/app-preview.apk

      - name: Distribute to Firebase testers
        if: inputs.profile == 'preview' && inputs.distribute
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON || secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ inputs.testerGroups }}
          file: mobile/app-preview.apk
          releaseNotes: ${{ github.event.head_commit.message || format('Manual build from {0}', github.ref_name) }}
