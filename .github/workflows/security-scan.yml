name: Security Scan

on:
  push:
    branches: [main, develop, "feat/**", "fix/**"]
  pull_request:
    branches: [main, develop, "feat/**", "fix/**"]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency audit (all runtime + dev dependencies)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [server, client, mobile]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit all dependencies
        run: npm audit --json > "${{ runner.temp }}/npm-audit-${{ matrix.directory }}.json" || true
      - name: Enforce high/critical audit policy and active exceptions
        run: node ../scripts/security-exception-gate.mjs npm "${{ runner.temp }}/npm-audit-${{ matrix.directory }}.json" ../security/exceptions.json
      - name: Ensure machine-readable audit report exists
        if: always()
        run: |
          report="${{ runner.temp }}/npm-audit-${{ matrix.directory }}.json"
          if [ ! -s "$report" ]; then npm audit --json > "$report" || true; fi
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ matrix.directory }}
          path: ${{ runner.temp }}/npm-audit-${{ matrix.directory }}.json
          if-no-files-found: ignore
          retention-days: 30

  secrets:
    name: Secret and credential leak scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history and working tree for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL static analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze JavaScript and TypeScript
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  filesystem:
    name: Filesystem, dependency, secret and configuration scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Scan dependencies, OS packages, secrets and misconfigurations
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          version: latest
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "0"
          format: sarif
          output: trivy-results.sarif
          skip-dirs: .git,node_modules,mobile/node_modules,client/node_modules,server/node_modules
      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-filesystem
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-results.sarif
          if-no-files-found: ignore
          retention-days: 30
      - name: Enforce Trivy findings and active exceptions
        if: always()
        run: node scripts/security-exception-gate.mjs trivy trivy-results.sarif security/exceptions.json

  dast-staging:
    name: Passive DAST against explicitly configured staging
    if: vars.STAGING_BASE_URL != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate staging target is HTTPS
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: |
          node -e 'const u = new URL(process.env.STAGING_BASE_URL); if (u.protocol !== "https:" || u.username || u.password) process.exit(1); console.log("Validated HTTPS staging target:", u.origin)'
      - name: Run OWASP ZAP baseline scan (passive checks only)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ vars.STAGING_BASE_URL }}
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-staging-baseline-report
      - name: Record target-scope reminder
        if: always()
        run: echo "This job uses the repository STAGING_BASE_URL variable. Do not point it at production or a target without explicit authorization."

  dependency-review:
    name: Pull request dependency review
    if: github.event_name == 'pull_request' && vars.ENABLE_DEPENDENCY_REVIEW == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Block newly introduced high-risk dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
