name: Stashr Launcher Android Release

# Builds the Stashr Launcher: Lawnchair at the commit pinned in launcher-app/UPSTREAM, plus the Stashr changes (launcher-app/apply.py and
# launcher-app/overlay). Started by hand (Actions -> Stashr Launcher Android Release -> Run workflow), because a Lawnchair build is long.
# The signed APK is published as its own GitHub Release (tag stashr-launcher-v<version>-build-<code>), never marked "latest": the main
# Stashr app's update check reads releases/latest.
on:
  workflow_dispatch:
    inputs:
      releaseNotes:
        description: "Notes for this Stashr Launcher build"
        type: string
        default: "Stashr Launcher update"
        required: true

permissions:
  contents: write

concurrency:
  group: stashr-launcher-release
  cancel-in-progress: false

jobs:
  build-release:
    name: Build, sign and publish Stashr Launcher APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify persistent Android signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Add all four secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/stashr-upload.jks"
          keytool -list -keystore "$RUNNER_TEMP/stashr-upload.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Stamp version
        id: release
        shell: bash
        env:
          RELEASE_NOTES_INPUT: ${{ inputs.releaseNotes }}
        run: |
          APP_VERSION=$(tr -d '[:space:]' < launcher-app/version.txt)
          echo "$APP_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::launcher-app/version.txt must look like 1.2.3"; exit 1; }
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          NOTES="${RELEASE_NOTES_INPUT:-Stashr Launcher update}"
          {
            echo "app_version=$APP_VERSION"
            echo "version_code=$VERSION_CODE"
            echo "tag=stashr-launcher-v$APP_VERSION-build-$VERSION_CODE"
            echo "release_notes<<EOF"
            printf '%s\n' "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Building Stashr Launcher $APP_VERSION (versionCode $VERSION_CODE)"

      - name: Get Lawnchair at the pinned commit
        shell: bash
        run: |
          . launcher-app/UPSTREAM
          test -n "$repo" && test -n "$sha" || { echo "::error::launcher-app/UPSTREAM needs repo= and sha="; exit 1; }
          git init -q lawnchair
          cd lawnchair
          git remote add origin "$repo"
          git fetch -q --depth 1 origin "$sha"
          git checkout -q FETCH_HEAD
          git submodule update --init --recursive --depth 1 || git submodule update --init --recursive
          echo "Lawnchair is at $(git rev-parse --short HEAD)"

      - name: Apply the Stashr changes
        run: python3 launcher-app/apply.py lawnchair

      - name: Build signed release APK
        working-directory: lawnchair
        shell: bash
        env:
          STASHR_VERSION_NAME: ${{ steps.release.outputs.app_version }}
          STASHR_VERSION_CODE: ${{ steps.release.outputs.version_code }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Lawnchair reads its signing key from keystore.properties in the project root
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
            echo "storeFile=$RUNNER_TEMP/stashr-upload.jks"
          } > keystore.properties
          ./gradlew assembleLawnWithQuickstepGithubRelease --no-daemon --stacktrace
          rm -f keystore.properties

      - name: Create update manifest and verify APK
        id: manifest
        shell: bash
        env:
          APP_VERSION: ${{ steps.release.outputs.app_version }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
          RELEASE_NOTES: ${{ steps.release.outputs.release_notes }}
        run: |
          APK=$(find lawnchair/build/outputs/apk -name '*.apk' -type f | head -n 1)
          test -n "$APK" || { echo "::error::Gradle did not produce an APK"; exit 1; }
          cp "$APK" stashr-launcher.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER" || { echo "::error::Android apksigner was not found"; exit 1; }
          "$APKSIGNER" verify --verbose stashr-launcher.apk
          # the build must really be the Stashr one: its package id and name
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)
          "$AAPT" dump badging stashr-launcher.apk | tee badging.txt | head -n 3
          grep -q "package: name='com.tanush.stashr.launcher'" badging.txt || { echo "::error::The APK does not have the Stashr package id"; exit 1; }
          grep -q "application-label:'Stashr Launcher'" badging.txt || { echo "::error::The APK is not named Stashr Launcher"; exit 1; }
          SHA256=$(sha256sum stashr-launcher.apk | cut -d ' ' -f 1)
          SIZE=$(stat -c '%s' stashr-launcher.apk)
          export SHA256 SIZE
          node - <<'NODE'
          const fs = require("fs");
          fs.writeFileSync("stashr-launcher-update.json", JSON.stringify({
            packageName: "com.tanush.stashr.launcher",
            version: process.env.APP_VERSION,
            versionCode: Number(process.env.VERSION_CODE),
            sha256: process.env.SHA256,
            sizeBytes: Number(process.env.SIZE),
            releaseNotes: process.env.RELEASE_NOTES,
            builtAt: new Date().toISOString(),
            commit: process.env.GITHUB_SHA
          }, null, 2) + "\n");
          NODE
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: stashr-launcher-v${{ steps.release.outputs.version_code }}
          path: |
            stashr-launcher.apk
            stashr-launcher-update.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish as a GitHub Release (not "latest")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Stashr Launcher ${{ steps.release.outputs.app_version }} (build ${{ steps.release.outputs.version_code }})
          body: |
            ${{ steps.release.outputs.release_notes }}

            - Package: `com.tanush.stashr.launcher`
            - Android versionCode: ${{ steps.release.outputs.version_code }}
            - Size: ${{ steps.manifest.outputs.size }} bytes
            - SHA-256: ${{ steps.manifest.outputs.sha256 }}
            - Based on Lawnchair (Apache-2.0); see launcher-app/NOTICE.md
            - Published by GitHub Actions from commit ${{ github.sha }}
          files: |
            stashr-launcher.apk
            stashr-launcher-update.json
          make_latest: "false"
          fail_on_unmatched_files: true
