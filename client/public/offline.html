<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aurelia — offline</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background:
          radial-gradient(900px 600px at 15% -10%, rgba(139,92,246,.35) 0%, transparent 60%),
          radial-gradient(700px 500px at 90% 10%, rgba(236,72,153,.22) 0%, transparent 60%),
          #07061a;
        color: #e9e6ff;
        padding: 2rem;
      }
      .card {
        max-width: 380px;
        text-align: center;
        background: rgba(24,20,58,.75);
        border: 1px solid rgba(167,139,250,.2);
        border-radius: 24px;
        padding: 2.6rem 2rem;
        box-shadow: 0 28px 70px rgba(0,0,0,.5);
      }
      .seal {
        width: 62px; height: 62px; margin: 0 auto 1.4rem;
        border-radius: 50%; display: grid; place-items: center;
        background: linear-gradient(135deg, #8b5cf6, #ec4899);
        box-shadow: 0 12px 30px rgba(139,92,246,.5);
      }
      h1 { font-weight: 700; color: #fff; letter-spacing: -.02em; font-size: 1.8rem; margin: 0 0 .6rem; }
      p { color: rgba(233,230,255,.68); line-height: 1.7; font-size: .93rem; margin: 0 0 1.6rem; }
      button {
        border: none; cursor: pointer; border-radius: 999px; padding: .85rem 1.8rem;
        background: linear-gradient(135deg, #8b5cf6, #ec4899); color: #fff; font-size: .95rem;
        box-shadow: 0 10px 28px rgba(139,92,246,.45);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="seal">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.4 7.5 9.5 4.3-1.1 7.5-4.9 7.5-9.5V6L12 3z" /><path d="M9 12l2 2 4-4" />
        </svg>
      </div>
      <h1>No connection</h1>
      <p>Your vault needs the internet to unseal anything. Reconnect and we will pick up right where you left off.</p>
      <button onclick="window.location.reload()">Try again</button>
    </div>
  </body>
</html>
