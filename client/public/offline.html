<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aurelia — offline</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background:
          radial-gradient(900px 600px at 15% -10%, #f4dde0 0%, transparent 60%),
          radial-gradient(700px 500px at 90% 10%, rgba(201,130,139,.18) 0%, transparent 60%),
          #fff9f5;
        color: #332c2d;
        padding: 2rem;
      }
      .card {
        max-width: 380px;
        text-align: center;
        background: #fff;
        border-radius: 24px;
        padding: 2.6rem 2rem;
        box-shadow: 0 22px 60px rgba(122, 62, 72, 0.12);
      }
      .seal {
        width: 62px; height: 62px; margin: 0 auto 1.4rem;
        border-radius: 50%; display: grid; place-items: center;
        background: linear-gradient(140deg, #c9828b, #7a3e48);
        box-shadow: 0 12px 26px rgba(201,130,139,.35);
      }
      h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 500; color: #63313a; font-size: 1.8rem; margin: 0 0 .6rem; }
      p { color: rgba(51,44,45,.66); line-height: 1.7; font-size: .93rem; margin: 0 0 1.6rem; }
      button {
        border: none; cursor: pointer; border-radius: 999px; padding: .85rem 1.8rem;
        background: linear-gradient(135deg, #c9828b, #7a3e48); color: #fff; font-size: .95rem;
        box-shadow: 0 10px 28px rgba(201,130,139,.32);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="seal">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff9f5" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20.5s-7.4-4.6-9.2-9A5 5 0 0 1 12 6.6a5 5 0 0 1 9.2 4.9c-1.8 4.4-9.2 9-9.2 9z" />
        </svg>
      </div>
      <h1>No connection</h1>
      <p>Your vault needs the internet to unseal anything. We will be right here when you are back online.</p>
      <button onclick="window.location.reload()">Try again</button>
    </div>
  </body>
</html>
