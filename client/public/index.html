<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Aurelia · Aurora Password Vault</title>
    <meta
      name="description"
      content="Aurelia is a glowing, private vault for every password — sealed with AES-256, with live vault-health insights and an Android app."
    />

    <!-- Theme + PWA -->
    <meta name="theme-color" content="#07061A" />
    <meta name="color-scheme" content="dark light" />
    <script>
      /* Apply the saved theme before first paint so there is no flash */
      (function () {
        try {
          var t = localStorage.getItem("aurelia_theme");
          if (t !== "light" && t !== "dark") t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
      })();
    </script>
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/icons/icon-16.png" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/apple-touch-icon.png" />
    <link rel="mask-icon" href="%PUBLIC_URL%/icons/icon-192.png" color="#8B5CF6" />

    <!-- Installed-app behaviour on iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aurelia" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Aurelia" />

    <!-- Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Aurelia · Aurora Password Vault" />
    <meta
      property="og:description"
      content="A glowing, private vault for every password you own."
    />
    <meta property="og:image" content="%PUBLIC_URL%/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <!-- Typography: Sora for display, Inter for reading, JetBrains Mono for secrets -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Aurelia.</noscript>
    <div id="root"></div>
  </body>
</html>
