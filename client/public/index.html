<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Aurelia · Password Manager</title>
    <meta
      name="description"
      content="A private, encrypted password manager. Every credential sealed with AES-256 encryption."
    />

    <!-- Theme + PWA -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="color-scheme" content="light" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/icons/icon-16.png" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/apple-touch-icon.png" />
    <link rel="mask-icon" href="%PUBLIC_URL%/icons/icon-192.png" color="#2563eb" />

    <!-- Installed-app behaviour on iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Aurelia" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Aurelia" />

    <!-- Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Aurelia · Password Manager" />
    <meta
      property="og:description"
      content="A private, encrypted password manager for all your credentials."
    />
    <meta property="og:image" content="%PUBLIC_URL%/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <!-- Typography: one grotesk for the interface, a mono for secrets -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Aurelia.</noscript>
    <div id="root"></div>
  </body>
</html>
