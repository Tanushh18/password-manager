<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Stashr · Passwords &amp; Projects, Encrypted</title>
    <meta
      name="description"
      content="Stashr is a private, end-to-end encrypted vault for every password and every project you run — hosting, databases, env vars, sealed with AES-256."
    />

    <!-- Theme + PWA -->
    <meta name="theme-color" content="#0F1113" />
    <meta name="color-scheme" content="dark light" />
    <script>
      /* Apply the saved theme before first paint so there is no flash */
      (function () {
        try {
          var t = localStorage.getItem("aurelia_theme");
          if (t !== "light" && t !== "dark") t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
      })();
    </script>
    <link rel="manifest" href="/manifest.json" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="mask-icon" href="/icons/icon-192.png" color="#31AAA9" />

    <!-- Installed-app behaviour on iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stashr" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Stashr" />

    <!-- Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Stashr · Passwords & Projects, Encrypted" />
    <meta
      property="og:description"
      content="A glowing, private vault for every password you own."
    />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <!-- Typography: Sora for display, Inter for reading, JetBrains Mono for secrets -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Stashr.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
